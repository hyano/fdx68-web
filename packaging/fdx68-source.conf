# FDX68 配布元の定義。
#
# 新版が出たら**このファイルだけ**を更新すること（install.sh 本体は触らない）。
# 更新手順は docs/guide/installation.md の「配布元の設定と更新手順」を参照。
#
# 注意（実測で確認した事実、docs/reference/fdx68-version-notes.md 参照）:
#
#  * 固定 URL fdx68.tar.gz の中身は 32bit(armhf) 版である。
#  * 64bit 版に固定 URL は存在しない。バージョン番号付きの URL のみ。
#    そのため新版のたびに URL の更新が必要になる。
#  * 配布は HTTP（平文）である。取得したバイナリは root で /usr/local/bin に置かれ、
#    fddemu は /dev/mem を直接触るため、SHA256 を必ず照合する。

FDX68_VERSION="2.10"
FDX68_BASE_URL="http://retropc.net/gimons/fdx68"

# --- aarch64（64bit Raspberry Pi OS）---------------------------------------
# 固定 URL がないため、バージョン番号付きの URL を直接指定している。
FDX68_URL_aarch64="${FDX68_BASE_URL}/fdx68_210_aarch64.tar.gz"
FDX68_SHA256_aarch64="a0972d82bd0d0ae8ef95b1387c50bbf5aa44bc4e3565382cbd97519b25f5fde5"

# --- armhf（32bit Raspberry Pi OS）------------------------------------------
# こちらは固定 URL が提供されている。
FDX68_URL_armhf="${FDX68_BASE_URL}/fdx68.tar.gz"
FDX68_SHA256_armhf="1030249144b77ee8ea717b6473bad4824263734cdb5340f1134fa3c4360d29aa"

# tarball に含まれるコマンド（フラット構造で、トップレベルディレクトリを持たない）
FDX68_COMMANDS="fddemu fddctl fdxconv fdxtool fdxview fdxtrkcpy fddump fdrestore fdunformat fdinfo"

# 効果音の wav（V2PRO 基板・PRO 化アドオンボード用）
FDX68_ASSETS="fddseek.wav fddinsert.wav fddeject.wav"
