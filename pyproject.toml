[project]
name = "fdx68-web"
version = "0.1.0"
description = "FDX68 を Web ブラウザから操作するためのコントローラ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Raspberry Pi OS Bookworm (Python 3.11) でも動作する必要があるため、
# 3.12 以降でしか使えない構文・API は使わない。
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",  # multipart/form-data によるアップロードに必要
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # pytest で assert を使うため
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# FastAPI は Depends()/File()/Form() を引数の既定値に書くのが公式の書き方
"app/api/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
